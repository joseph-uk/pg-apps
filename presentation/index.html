<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Title will be set dynamically by JS based on mode -->
    <title>Presentation</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<!-- Body class will be added by JS: 'mode-controller' or 'mode-slideshow' -->
<body>
<div id="app">
    <!-- Initial Landing Page (Only shown in Controller mode initially) -->
    <div id="landing-page">
        <h1>Paragliding Apps Presentation</h1>
        <button id="start-button">Start Slideshow</button>
        <p id="loading-error" class="error-message" style="display: none;"></p>
    </div>
    
    <!-- Presentation Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h2>Presentation Settings</h2>
            <div class="settings-group">
                <h3>Display Mode</h3>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="display-mode" value="full" checked>
                        Full Slide Mode
                        <span class="description">Display entire slides at once</span>
                    </label>
                    <label>
                        <input type="radio" name="display-mode" value="bullet">
                        Bullet-by-bullet Mode
                        <span class="description">Reveal bullet points one at a time</span>
                    </label>
                </div>
            </div>
            <div class="settings-group">
                <h3>Advancement Method</h3>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="advance-method" value="manual" checked>
                        Manual (Space/Click)
                        <span class="description">Advance with keyboard or mouse click</span>
                    </label>
                    <label>
                        <input type="radio" name="advance-method" value="auto">
                        Automatic
                        <span class="description">Auto-advance after delay</span>
                    </label>
                </div>
                <div id="auto-delay-container">
                    <label for="auto-delay">Delay (milliseconds):</label>
                    <input type="number" id="auto-delay" min="1000" max="60000" step="1000" value="5000">
                </div>
            </div>
            
            <div class="settings-group">
                <h3>Timer Thresholds</h3>
                <div class="timer-settings">
                    <div class="timer-setting-group">
                        <h4>Slide Timer</h4>
                        <div class="input-group">
                            <label for="slide-warning-time">Warning (seconds):</label>
                            <input type="number" id="slide-warning-time" min="10" max="600" step="5" value="60">
                        </div>
                        <div class="input-group">
                            <label for="slide-over-time">Over (seconds):</label>
                            <input type="number" id="slide-over-time" min="15" max="1200" step="5" value="120">
                        </div>
                    </div>
                    <div class="timer-setting-group">
                        <h4>Presentation Timer</h4>
                        <div class="input-group">
                            <label for="presentation-warning-time">Warning (minutes):</label>
                            <input type="number" id="presentation-warning-time" min="1" max="60" step="1" value="15">
                        </div>
                        <div class="input-group">
                            <label for="presentation-over-time">Over (minutes):</label>
                            <input type="number" id="presentation-over-time" min="2" max="120" step="1" value="20">
                        </div>
                        <div class="input-group">
                            <label for="min-average-time">Min Average (seconds):</label>
                            <input type="number" id="min-average-time" min="10" max="300" step="5" value="30">
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="button-group">
                <button id="cancel-settings" class="secondary-button">Cancel</button>
                <button id="apply-settings">Start Presentation</button>
            </div>
        </div>
    </div>

    <!-- Slideshow Container (Used only in Slideshow Mode) -->
    <div id="slideshow-container">
        <div class="slide-overlay"></div>
        <div id="slide-content-wrapper">
            <div id="slide-content">
                <!-- Slide content injected here -->
            </div>
        </div>
        <!-- Nav buttons hidden in slideshow mode via CSS, controlled by Controller -->
        <button id="prev-slide" class="nav-button controller-only" aria-label="Previous Slide"><</button>
        <button id="next-slide" class="nav-button controller-only" aria-label="Next Slide">></button>
        <div id="slide-number-display" class="controller-only"></div> <!-- Also controller only -->
        <p id="slide-error" class="error-message" style="display: none;"></p> <!-- Show error in either window -->
    </div>

    <!-- Notes Display Area (Used only in Controller Mode after start) -->
    <div id="notes-display-area" style="display: none;">
        <div id="notes-header">
<!--            <h1>Speaker Notes</h1>-->
            <div id="controls-and-timers-container">
                <div id="timers-container">
                    <div id="timer-controls">
                        <button id="pause-timers" class="timer-button">Pause Timers</button>
                    </div>
                    <div id="timer-displays">
                        <div class="timer-wrapper">
                            <span class="timer-label">Slide:</span>
                            <span id="slide-timer" class="timer">00:00</span>
                            <small id="slide-timer-over-ref" class="timer-over-ref">Over: 2:00</small>
                        </div>
                        <div class="timer-wrapper">
                            <span class="timer-label">Presentation:</span>
                            <span id="presentation-timer" class="timer">00:00</span>
                            <small id="presentation-timer-over-ref" class="timer-over-ref">Over: 20:00</small>
                        </div>
                        <div class="timer-wrapper" style="display: none;">
                            <span class="timer-label">Average:</span>
                            <span id="average-timer" class="timer">00:00</span>
                            <span id="average-status" class="average-status average-good">Good Pace</span>
                            <small id="average-timer-ref" class="timer-over-ref">Min: 0:30</small>
                        </div>
                    </div>
                </div>
                <div id="notes-controls">
                    <span id="notes-slide-number">Slide: - / -</span>
                    <button id="notes-prev-slide" aria-label="Previous Slide">< Prev</button>
                    <button id="notes-next-slide" aria-label="Next Slide">Next ></button>
                </div>
            </div>
        </div>
        <div id="notes-content-area" class="pre-wrap">Notes will appear here once slideshow starts.</div>
    </div>

</div> <!-- End #app -->

<script src="script.js"></script>
</body>
</html>
