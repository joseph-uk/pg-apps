name: Update CSV Data

on:
  workflow_dispatch:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'

jobs:
  update-csv:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Download CSV
      run: |
        mkdir -p data
        # Backup existing file if it exists
        if [ -f data/paragliding-apps.csv ]; then
          cp data/paragliding-apps.csv data/paragliding-apps.csv.old
        fi
        curl -L "https://docs.google.com/spreadsheets/d/e/2PACX-1vTTebtcc367STxJXR6VWwH_wDke9hrwHgwJYdUCkdKK6VgrO_L6f04OqtgruNvzEIlQ_k8bS8AxNpmg/pub?output=csv" \
          --fail --output data/paragliding-apps.csv.new

    - name: Sort CSV data
      run: |
        # Skip header line, sort the data, then add header back
        if [ -f data/paragliding-apps.csv.new ]; then
          # Preserve the header
          head -1 data/paragliding-apps.csv.new > data/header.csv
          # Sort the data (skip header)
          tail -n +2 data/paragliding-apps.csv.new | sort > data/sorted.csv
          # Combine header and sorted data
          cat data/header.csv data/sorted.csv > data/paragliding-apps.csv
          # Clean up temporary files
          rm data/paragliding-apps.csv.new data/header.csv data/sorted.csv
        fi

    - name: Calculate changes
      id: calc_changes
      run: |
        if [ -f data/paragliding-apps.csv.old ]; then
          # Save headers for comparison
          head -1 data/paragliding-apps.csv.old > data/old_header.csv
          head -1 data/paragliding-apps.csv > data/new_header.csv
          
          # Get data without headers for comparison
          tail -n +2 data/paragliding-apps.csv.old > data/old_data.csv
          tail -n +2 data/paragliding-apps.csv > data/new_data.csv
          
          # Count rows in each file
          old_count=$(wc -l < data/old_data.csv)
          new_count=$(wc -l < data/new_data.csv)
          
          # Find rows added/removed/updated
          grep -vFxf data/old_data.csv data/new_data.csv > data/added.csv
          grep -vFxf data/new_data.csv data/old_data.csv > data/removed.csv
          
          # Count rows
          added_count=$(wc -l < data/added.csv)
          removed_count=$(wc -l < data/removed.csv)
          
          # Approximate updated rows (removing exact adds/removals)
          total_changes=$((added_count + removed_count))
          updated_count=$((total_changes - added_count - removed_count))
          if [ "$updated_count" -lt 0 ]; then 
            updated_count=0
          fi
          
          # Save counts as outputs
          echo "added_count=$added_count" >> $GITHUB_OUTPUT
          echo "removed_count=$removed_count" >> $GITHUB_OUTPUT
          echo "updated_count=$updated_count" >> $GITHUB_OUTPUT
          
          # Clean up temporary files
          rm data/*.old data/old_data.csv data/new_data.csv data/added.csv data/removed.csv data/old_header.csv data/new_header.csv
        else
          # First run, all rows are new
          count=$(tail -n +2 data/paragliding-apps.csv | wc -l)
          echo "added_count=$count" >> $GITHUB_OUTPUT
          echo "removed_count=0" >> $GITHUB_OUTPUT
          echo "updated_count=0" >> $GITHUB_OUTPUT
        fi

    - name: Check for changes
      id: check_changes
      run: |
        git add data/paragliding-apps.csv
        if ! git diff --cached --quiet; then
          echo "changes_detected=true" >> $GITHUB_OUTPUT
        else
          echo "changes_detected=false" >> $GITHUB_OUTPUT
        fi

    - name: Create Pull Request
      if: steps.check_changes.outputs.changes_detected == 'true'
      run: |
        # Set up git
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        # Create a new branch with timestamp
        BRANCH_NAME="update-csv-data-$(date +%Y%m%d-%H%M%S)"
        git checkout -b $BRANCH_NAME
        
        # Commit changes
        git add data/paragliding-apps.csv
        git commit -m "Update CSV data [automated]"
        git push origin $BRANCH_NAME
        
        # Create change summary
        CHANGE_SUMMARY="CSV Data Changes Summary:\n\n"
        
        if [ "${{ steps.calc_changes.outputs.added_count }}" -gt 0 ]; then
          CHANGE_SUMMARY+="
        - ${{ steps.calc_changes.outputs.added_count }} rows added
        "
        fi
        
        if [ "${{ steps.calc_changes.outputs.removed_count }}" -gt 0 ]; then
          CHANGE_SUMMARY+="
        - ${{ steps.calc_changes.outputs.removed_count }} rows removed
        "
        fi
        
        if [ "${{ steps.calc_changes.outputs.updated_count }}" -gt 0 ]; then
          CHANGE_SUMMARY+="
        - ${{ steps.calc_changes.outputs.updated_count }} rows updated
        "
        fi
        
        # Create PR with change summary
        gh pr create \
          --title "Update CSV data (automated)" \
          --body "This PR contains the latest CSV data updates from the automated workflow.
        $CHANGE_SUMMARY" \
          --base main \
          --head $BRANCH_NAME
      env:
        GITHUB_TOKEN: ${{ github.token }}
